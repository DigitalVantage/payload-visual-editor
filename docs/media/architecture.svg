<svg xmlns="http://www.w3.org/2000/svg" width="790" height="480" viewBox="0 0 790 480" role="img" aria-labelledby="t d"><title id="t">How the visual editor talks to your site</title><desc id="d">The Payload admin holds the visual editor plugin, the document form and the stock Live Preview, which renders your site in an iframe. Document data reaches the page only through the stock Live Preview messages. A separate editor channel carries intent: the admin sends hello, edit-mode, focus and op-ack; the page sends select, op, reveal and history. In the iframe, the site SDK scans elements marked with data-pve-* attributes and draws the overlay.</desc><rect width="790" height="480" fill="#0a0907"/><rect x="30.0" y="24.0" width="730.0" height="128.0" rx="8" fill="#1a1712" stroke="#6b7280"/><text x="46.0" y="46.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="start">Payload admin</text><rect x="46.0" y="58.0" width="216.7" height="78.0" rx="8" fill="#12100c" stroke="#7aa2c4"/><text x="60.0" y="84.0" fill="#f5f1ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" text-anchor="start">Visual editor plugin</text><text x="60.0" y="104.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">controller · popovers</text><text x="60.0" y="121.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">undo / redo history</text><rect x="286.7" y="58.0" width="216.7" height="78.0" rx="8" fill="#12100c" stroke="#6b7280"/><text x="300.7" y="84.0" fill="#f5f1ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" text-anchor="start">Document form</text><text x="300.7" y="104.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">native Payload fields</text><text x="300.7" y="121.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">save · autosave · locales</text><rect x="527.3" y="58.0" width="216.7" height="78.0" rx="8" fill="#12100c" stroke="#d4a04a"/><text x="541.3" y="84.0" fill="#f5f1ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" text-anchor="start">Live Preview</text><text x="541.3" y="104.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">stock Payload,</text><text x="541.3" y="121.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">renders the iframe</text><line x1="265.7" y1="97.0" x2="276.7" y2="97.0" stroke="#7aa2c4" stroke-width="2"/><polygon points="283.7,97.0 276.7,101.2 276.7,92.8" fill="#7aa2c4"/><line x1="506.3" y1="97.0" x2="517.3" y2="97.0" stroke="#6b7280" stroke-width="2"/><polygon points="524.3,97.0 517.3,101.2 517.3,92.8" fill="#6b7280"/><text x="106.0" y="178.0" fill="#7aa2c4" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="start">admin → page</text><text x="106.0" y="195.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">hello · edit-mode · focus · op-ack</text><text x="106.0" y="222.0" fill="#6ba368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="start">page → admin</text><text x="106.0" y="239.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">select · op · reveal · history</text><text x="567.3" y="195.0" fill="#d4a04a" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="start">document data</text><text x="567.3" y="212.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">stock Live Preview</text><text x="567.3" y="229.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">messages, untouched</text><rect x="30.0" y="264.0" width="730.0" height="128.0" rx="8" fill="#1a1712" stroke="#6b7280"/><text x="46.0" y="381.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="start">Your site · Live Preview iframe</text><rect x="46.0" y="280.0" width="216.7" height="78.0" rx="8" fill="#12100c" stroke="#7aa2c4"/><text x="60.0" y="306.0" fill="#f5f1ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" text-anchor="start">Site SDK</text><text x="60.0" y="326.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">scanner · overlay</text><text x="60.0" y="343.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">chip · drag · keys</text><rect x="286.7" y="280.0" width="457.3" height="78.0" rx="8" fill="#12100c" stroke="#d4a04a"/><text x="300.7" y="306.0" fill="#f5f1ea" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" text-anchor="start">Your pages</text><text x="300.7" y="326.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">components marked with data-pve-* attributes,</text><text x="300.7" y="343.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">rendered from the Live Preview data</text><line x1="283.7" y1="319.0" x2="272.7" y2="319.0" stroke="#6b7280" stroke-width="2"/><polygon points="265.7,319.0 272.7,314.8 272.7,323.2" fill="#6b7280"/><line x1="68.0" y1="136.0" x2="68.0" y2="272.0" stroke="#7aa2c4" stroke-width="2"/><polygon points="68.0,279.0 63.8,272.0 72.2,272.0" fill="#7aa2c4"/><line x1="88.0" y1="280.0" x2="88.0" y2="144.0" stroke="#6ba368" stroke-width="2"/><polygon points="88.0,137.0 92.2,144.0 83.8,144.0" fill="#6ba368"/><line x1="549.3" y1="136.0" x2="549.3" y2="272.0" stroke="#d4a04a" stroke-width="2"/><polygon points="549.3,279.0 545.1,272.0 553.5,272.0" fill="#d4a04a"/><text x="30.0" y="422.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">The editor channel carries intent and metadata only; document data never leaves the</text><text x="30.0" y="440.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" text-anchor="start">stock pipeline. postMessage uses an explicit target origin and a per-load session id.</text><text x="760.0" y="466.0" fill="#9ca3af" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="400" text-anchor="end">www.digitalvantage.pl</text></svg>
